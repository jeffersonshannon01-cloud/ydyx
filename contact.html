        body {font-family: Arial, sans-serif; margin:0; padding:0; line-height:1.6; color:#333;}
        header {background:#004080; color:#fff; padding:2rem; text-align:center;}
        nav {background:#f4f4f4; padding:1rem; display:flex; justify-content:center; gap:2rem;}
        nav a {color:#004080; text-decoration:none; font-weight:bold;}
        .section {padding:2rem; max-width:600px; margin:auto;}
        .section h2 {text-align:center;}
        form {background:#f9f9f9; padding:2rem; border-radius:8px;}
        label {display:block; margin-top:1rem;}
        input, textarea, select {width:100%; padding:0.5rem; margin-top:0.3rem; border:1px solid #ccc; border-radius:4px;}
        .btn {display:block; width:100%; background:#004080; color:#fff; border:none; padding:0.8rem; margin-top:1.5rem; border-radius:4px; cursor:pointer; font-size:1rem;}
        .btn:hover {background:#003366;}
        footer {background:#004080; color:#fff; text-align:center; padding:1rem; margin-top:2rem;}
    </style>
</head>
<body>
    <header>
        <h1>联系我们</h1>
    </header>
    <nav>
        <a href="index.html">首页</a>
        <a href="services.html">服务</a>
        <a href="knowledge.html">知识中心</a>

    <section class="section">
        <h2>在线咨询</h2>
        <form action="#" method="post">
            <label for="name">姓名：*</label>
            <input type="text" id="name" name="name" required>
            
            <label for="phone">联系电话：*</label>
            <input type="tel" id="phone" name="phone" required>
            
            <label for="email">电子邮箱：*</label>
            <input type="email" id="email" name="email" required>
            
            <label for="type">咨询类型：*</label>
            <select id="type" name="type" required>
                <option value="">请选择咨询类型</option>
                <option value="enterprise">企业债务化解</option>
                <option value="personal">个人破产</option>
                <option value="both">企业及个人</option>
            </select>
            
            <label for="message">留言或需求描述：*</label>
            <textarea id="message" name="message" rows="5" required></textarea>
            
            <button type="submit" class="btn">提交咨询</button>
        </form>
        <p style="text-align:center; margin-top:1.5rem;">或直接致电：<strong>13908373468</strong></p>
    </section>
    <footer>
